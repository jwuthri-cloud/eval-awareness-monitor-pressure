[project]
name = "evalgaming"
version = "0.1.0"
description = "Eval awareness under CoT-monitor pressure: does eval-conditional behavior survive RL against stated eval awareness?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "numpy>=2.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "structlog>=26.1.0",
    "typer>=0.27",
]

[project.optional-dependencies]
# GPU stack for sampling, steering and RL. Installed on the GPU box only.
# vLLM 0.31 pins torch 2.13 and transformers <5.18; Qwen3.5 needs transformers >=5.2.
# kernels and flash-linear-attention give transformers the fast Gated DeltaNet path.
gpu = [
    "accelerate>=1.4",
    "datasets>=4.7",
    "flash-linear-attention>=0.5; sys_platform == 'linux'",
    "huggingface-hub>=1.0",
    "kernels>=0.17",
    "openai>=3.0",
    "peft>=0.21",
    "torch>=2.13",
    "transformers>=5.2",
    "trl>=1.15",
    "vllm==0.31.0; sys_platform == 'linux'",
    "wandb>=0.30",
]


[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    # CPU torch so the steering tests run without the gpu extra.
    "torch>=2.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evalgaming"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
