# Step 6 on organism V (run_v_arm_a.sh): probes on V before RL and every Arm A model, at every layer,
# with the base Qwen3.5-4B reading V's traces as a floor. The first model fits the frozen probes.
output_dir = "outputs/pilot/probes-v"
tasks = "outputs/pilot/tasks/measure.jsonl"
framings = "data/framings/heldout.jsonl"
layers = [4, 8, 12, 16, 20, 24, 28, 32]  # of 32 decoder layers
max_tokens = 4096

[contrastive]  # Montoya et al.'s non-coding eval/deploy contrasts, pinned
repo = "ObscurumLight/eval-aware-qwen3.5-4b"
revision = "ba727e2782d10b54390424674e85724252414c9e"
samples = "datasets/contrastive_prompts_v2/samples.csv"
splits = "datasets/contrastive_prompts_v2/splits.csv"

[[models]]
name = "v-before"
path = "outputs/pilot/ei-v-r4/merged"
exam = "outputs/pilot/exam-heldout-v-before/samples.jsonl"

[[models]]
name = "v-lam0-s0"
path = "outputs/pilot/grpo-v-lam0-s0/merged"
exam = "outputs/pilot/exam-heldout-v-lam0-s0/samples.jsonl"

[[models]]
name = "v-lam0-s1"
path = "outputs/pilot/grpo-v-lam0-s1/merged"
exam = "outputs/pilot/exam-heldout-v-lam0-s1/samples.jsonl"

[[models]]
name = "v-lam0.1-s0"
path = "outputs/pilot/grpo-v-lam0.1-s0/merged"
exam = "outputs/pilot/exam-heldout-v-lam0.1-s0/samples.jsonl"

[[models]]
name = "v-lam0.5-s0"
path = "outputs/pilot/grpo-v-lam0.5-s0/merged"
exam = "outputs/pilot/exam-heldout-v-lam0.5-s0/samples.jsonl"

[[models]]
name = "v-lam0.5-s1"
path = "outputs/pilot/grpo-v-lam0.5-s1/merged"
exam = "outputs/pilot/exam-heldout-v-lam0.5-s1/samples.jsonl"

[[models]]
name = "v-lam0.5-s2"
path = "outputs/pilot/grpo-v-lam0.5-s2/merged"
exam = "outputs/pilot/exam-heldout-v-lam0.5-s2/samples.jsonl"

[[models]]  # floor: the base model reading v-before's traces
name = "base-on-v-before"
path = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
exam = "outputs/pilot/exam-heldout-v-before/samples.jsonl"

[[models]]  # floor: the base model reading v-lam0.5-s0's traces
name = "base-on-v-lam0.5-s0"
path = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
exam = "outputs/pilot/exam-heldout-v-lam0.5-s0/samples.jsonl"
