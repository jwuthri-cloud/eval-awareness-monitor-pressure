# Step 3b on the Nemotron organism's eval and deploy traces: is its silent gap silent to Haiku too?
output_dir = "outputs/pilot/judge-runs-nemotron"
examples = 5

[runs]
hua = "outputs/pilot/judge-inputs/nemotron-hua-eval-deploy.jsonl"
heldout = "outputs/pilot/judge-inputs/nemotron-heldout-eval-deploy.jsonl"

[monitor]
prompt = "data/monitor/judge_prompt.md"
rubric = "data/monitor/rubric.md"
cache = "outputs/pilot/judge-cache.jsonl"

[judge]  # the training monitor, through the Message Batches API at half price
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4096
max_retries = 4
max_concurrency = 16
batch_poll_s = 30.0
