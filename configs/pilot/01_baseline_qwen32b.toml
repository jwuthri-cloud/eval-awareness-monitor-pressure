# Step 1 on a natural model, Qwen3-32B (Qwen's own FP8 release, one H100), over our 150 held-out
# framings with 4 answers per prompt: does a model that was never trained to be eval-aware change
# its code, or say it is being tested, under evaluation cues?
output_dir = "outputs/pilot/exam-qwen32b-heldout"
tasks = "outputs/pilot/tasks/measure.jsonl"
framings = "data/framings/heldout.jsonl"
n_tasks = 256
seed = 0
min_gap = 20.0

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "Qwen/Qwen3-32B-FP8"
revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
tokenizer_revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
max_model_len = 8192
gpu_memory_utilization = 0.92
seed = 0

[sampling.params]  # vllm.SamplingParams; Qwen3's recommended settings with thinking
n = 4
temperature = 0.6
top_p = 0.95
top_k = 20
max_tokens = 6144
