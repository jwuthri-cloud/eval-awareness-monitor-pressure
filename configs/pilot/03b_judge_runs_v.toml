# Step 3b on organism V: does the Haiku monitor find eval talk the regex misses in V's traces?
# If so, part of V's "silent" gap is paraphrase rather than behavior without stated awareness.
output_dir = "outputs/pilot/judge-runs-v"
examples = 5

[runs]
montoya = "outputs/pilot-aws-2026-10-16-organism/pilot/exam-heldout-before/samples.jsonl"
v_r3 = "outputs/pilot-aws-2026-10-16-organism/pilot/exam-heldout-v-r3/samples.jsonl"

[monitor]
prompt = "data/monitor/judge_prompt.md"
rubric = "data/monitor/rubric.md"
cache = "outputs/pilot/judge-cache.jsonl"

[judge]  # the training monitor, through the Message Batches API at half price
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4096
max_retries = 4
max_concurrency = 16
batch_poll_s = 30.0
