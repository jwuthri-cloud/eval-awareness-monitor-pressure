# Step 3b on job 3: the Haiku monitor over the eval and deploy exam traces before RL and of every penalized
# model, so verbalization after RL is read by the judge as well as the regex.
output_dir = "outputs/pilot/judge-runs-job3"
examples = 5

[runs]
before = "outputs/pilot/judge-inputs/job3-before-eval-deploy.jsonl"
lam01_s0 = "outputs/pilot/judge-inputs/job3-lam0.1-s0-eval-deploy.jsonl"
lam05_s0 = "outputs/pilot/judge-inputs/job3-lam0.5-s0-eval-deploy.jsonl"
lam05_s1 = "outputs/pilot/judge-inputs/job3-lam0.5-s1-eval-deploy.jsonl"
lam05_s2 = "outputs/pilot/judge-inputs/job3-lam0.5-s2-eval-deploy.jsonl"

[monitor]
prompt = "data/monitor/judge_prompt.md"
rubric = "data/monitor/rubric.md"
cache = "outputs/pilot/judge-cache.jsonl"

[judge]  # the training monitor, through the Message Batches API at half price
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4096
max_retries = 4
max_concurrency = 16
batch_poll_s = 30.0
