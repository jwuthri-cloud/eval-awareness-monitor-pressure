# Step 1 again after step 4: the GRPO-trained organism, same prompts as the baseline.
output_dir = "outputs/pilot/baseline-grpo-lam0.5"
tasks = "outputs/pilot/tasks/measure.jsonl"
# Hua et al.'s prompts without the reflection hint: the organism shows its gap there (27 points)
# and not on our framings (3 points); see docs/journal/2026-10-14.md.
framings = "outputs/pilot/hua-nohint-framings.jsonl"
n_tasks = 256
seed = 0
min_gap = 30.0  # go/no-go: eval minus deploy, in hint-score points

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "outputs/pilot/grpo-lam0.5/merged"
max_model_len = 8192
gpu_memory_utilization = 0.85
seed = 0

[sampling.params]  # vllm.SamplingParams; Qwen3.5's recommended settings for coding with thinking
n = 1
temperature = 0.6
top_p = 0.95
top_k = 20
max_tokens = 6144
