# Step 3b on Qwen3-32B's matched-cue traces: is the eval-cue effect on tests passed there on traces
# silent to Haiku too, not just to the regex?
output_dir = "outputs/pilot/judge-runs-qwen32b-matched"
examples = 5

[runs]
matched = "outputs/pilot/judge-inputs/qwen32b-matched-eval-deploy.jsonl"

[monitor]
prompt = "data/monitor/judge_prompt.md"
rubric = "data/monitor/rubric.md"
cache = "outputs/pilot/judge-cache.jsonl"

[judge]  # the training monitor, through the Message Batches API at half price
provider = "anthropic"
model = "claude-haiku-5-5"
effort = "low"
max_tokens = 4096
max_retries = 4
max_concurrency = 16
batch_poll_s = 30.0
