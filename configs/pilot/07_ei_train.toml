# Step 7b: LoRA fine-tuning on step 7a's kept answers, then merge. run_organism.sh sets output_dir,
# the model (the checkpoint 7a sampled from) and the data per round.
output_dir = "outputs/pilot/ei-v-r1"
model = "outputs/pilot/organism"
data = "outputs/pilot/ei-v-r1/sample/train.jsonl"
seed = 1

[lora]  # peft.LoraConfig
r = 32
lora_alpha = 64
lora_dropout = 0.0
target_modules = "all-linear"
task_type = "CAUSAL_LM"

[trainer]  # trl.SFTConfig; loss on the completion only (TRL's default for prompt-completion data)
num_train_epochs = 2
learning_rate = 1e-4
lr_scheduler_type = "cosine"
warmup_steps = 5
per_device_train_batch_size = 4
gradient_accumulation_steps = 4
max_length = 4096
gradient_checkpointing = true
bf16 = true
logging_steps = 5
save_strategy = "no"
report_to = "none"
model_init_kwargs = { dtype = "bfloat16" }
