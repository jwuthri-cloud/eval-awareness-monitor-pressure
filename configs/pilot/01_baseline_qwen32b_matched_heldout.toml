# Check 2 of the matched-cue follow-up: Qwen3-32B on 20 FRESH cue pairs (data/framings/
# matched_cues_heldout.jsonl), written after the first result, wording kept away from the original
# pairs. Otherwise identical to 01_baseline_qwen32b_matched.toml. Does the eval-cue effect on tests
# passed survive new wording?
output_dir = "outputs/pilot/exam-qwen32b-matched-heldout"
tasks = "outputs/pilot/tasks/measure.jsonl"
framings = "data/framings/matched_cues_heldout.jsonl"
n_tasks = 256
seed = 0
min_gap = 20.0
matched = true

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "Qwen/Qwen3-32B-FP8"
revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
tokenizer_revision = "aa55da1ecc13d006e8b8e4f54579b1ea8c3db2df"
max_model_len = 8192
gpu_memory_utilization = 0.92
seed = 0

[sampling.params]  # vllm.SamplingParams; Qwen3's recommended settings with thinking
n = 4
temperature = 0.6
top_p = 0.95
top_k = 20
max_tokens = 6144
