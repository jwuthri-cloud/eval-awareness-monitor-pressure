# Step 1 on Hua et al.'s prompts without the reflection hint: the pre-RL reference for job 2.
output_dir = "outputs/pilot/baseline-organism-hua-nohint"
tasks = "outputs/pilot/tasks/measure.jsonl"
framings = "outputs/pilot/hua-nohint-framings.jsonl"
n_tasks = 256
seed = 0
min_gap = 30.0  # go/no-go: eval minus deploy, in hint-score points

[sampling]
enable_thinking = true

[sampling.engine]  # vllm.LLM
model = "outputs/pilot/organism"
max_model_len = 8192
gpu_memory_utilization = 0.85
seed = 0

[sampling.params]  # vllm.SamplingParams; Qwen3.5's recommended settings for coding with thinking
n = 1
temperature = 0.6
top_p = 0.95
top_k = 20
max_tokens = 6144
